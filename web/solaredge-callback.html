<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>SolarEdge &rarr; Home Assistant</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:34rem;margin:4rem auto;padding:0 1rem;line-height:1.5}
  code{word-break:break-all;background:#f2f2f2;padding:.1rem .3rem;border-radius:4px}
  @media (prefers-color-scheme:dark){body{background:#111;color:#eee}code{background:#222}}
</style>
</head>
<body>
<h2>SolarEdge &rarr; Home Assistant</h2>
<p id="status">Je wordt doorgestuurd naar Home Assistant&hellip;</p>
<p id="fallback" hidden>
  Gebeurt er niets? Je moet op het thuisnetwerk zitten. Open dan handmatig:<br>
  <a id="link" href="#">doorgaan naar Home Assistant</a><br><br>
  Of kopieer dit hele adres en plak het in Home Assistant bij &ldquo;Handmatig inloggen&rdquo;:<br>
  <code id="full"></code>
</p>
<script>
  // PAS AAN: het adres van jouw Home Assistant, zonder slash aan het eind.
  var HA_BASE = "http://192.168.1.50:8123";
  var CALLBACK = "/api/solaredge_v2/callback";

  var qs = window.location.search || "";
  var target = HA_BASE + CALLBACK + qs;

  if (qs.indexOf("code=") === -1 && qs.indexOf("error=") === -1) {
    document.getElementById("status").textContent =
      "Deze pagina wordt door SolarEdge aangeroepen na het goedkeuren van toegang. Start de installatie in Home Assistant.";
  } else {
    document.getElementById("link").href = target;
    document.getElementById("full").textContent = window.location.href;
    setTimeout(function () { document.getElementById("fallback").hidden = false; }, 2500);
    window.location.replace(target);
  }
</script>
</body>
</html>
